<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b6b4f">
<title>Ymo Express: shop online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14201a; --muted:#5d6b63; --line:#e1e6df; --bg:#f6f7f3; --card:#fff;
  --green:#0b6b4f; --green-d:#084f3b; --green-t:#e3f1ea; --pepper:#ff5a1f; --sun:#ffd23f; --danger:#b42318; --danger-t:#fde8e6;
  --r:14px; --shadow:0 1px 2px rgba(20,32,26,.06),0 6px 20px rgba(20,32,26,.06);
  --head:"Bricolage Grotesque",system-ui,sans-serif; --body:"DM Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:400 16px/1.5 var(--body);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
main{flex:1}
h1,h2,h3{font-family:var(--head);line-height:1.1;margin:0;letter-spacing:-.01em}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pepper);outline-offset:2px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.muted{color:var(--muted)}
.hide{display:none!important}

/* nav */
.nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:12px;height:64px}
.logo{font:800 22px var(--head);text-decoration:none;color:var(--green);display:flex;align-items:center;gap:8px;margin-right:auto}
.logo i{width:28px;height:28px;border-radius:9px;background:var(--pepper);display:grid;place-items:center;color:#fff;font:800 15px var(--head);font-style:normal}
.nav a.link{text-decoration:none;font-weight:500;padding:8px 10px;border-radius:8px}
.nav a.link:hover{background:var(--green-t)}

/* buttons + fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:11px 20px;font-weight:700;cursor:pointer;background:var(--green);color:#fff;text-decoration:none;transition:background .15s,transform .05s}
.btn:hover{background:var(--green-d)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.alt:hover{background:var(--green-t)}
.btn.hot{background:var(--pepper)}
.btn.hot:hover{background:#e84a10}
.btn.sm{padding:7px 14px;font-size:14px}
.btn.danger{background:#fff;color:var(--danger);border:1px solid #f3c5c0}
.btn.block{width:100%}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-weight:700;font-size:14px;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid #cfd6cd;background:#fff;border-radius:10px;padding:11px 12px}
.field textarea{resize:vertical;min-height:76px}
.field small{color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700;background:var(--green-t);color:var(--green-d)}
.pill.warn{background:#fff3cd;color:#7a5a00}
.pill.off{background:#eceeea;color:#555}
.pill.bad{background:var(--danger-t);color:var(--danger)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:20px}
.err{background:var(--danger-t);color:var(--danger);border-radius:10px;padding:10px 12px;margin-bottom:14px;font-weight:500}

/* hero */
.hero{background:var(--green);color:#fff;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;padding-top:48px;padding-bottom:48px}
.hero h1{font-size:clamp(34px,5.4vw,60px);font-weight:800}
.hero p{font-size:18px;max-width:30em;opacity:.9;margin:16px 0 24px}
.search{display:flex;background:#fff;border-radius:999px;padding:6px 6px 6px 18px;max-width:480px;align-items:center;gap:8px}
.search input{flex:1;border:0;outline:0;background:none;color:var(--ink);min-width:0;padding:8px 0}
.search:focus-within{box-shadow:0 0 0 3px var(--sun)}
.ticket{background:#fff;color:var(--ink);border-radius:18px;padding:22px;transform:rotate(2deg);box-shadow:0 20px 40px rgba(0,0,0,.25);position:relative}
.ticket::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;background:radial-gradient(circle at 8px 0,#fff 7px,transparent 8px) 0 0/16px 8px repeat-x}
.ticket h3{font-size:20px}
.ticket ol{list-style:none;margin:14px 0 0;padding:0}
.ticket li{display:flex;gap:10px;align-items:center;padding:6px 0;color:var(--muted)}
.ticket li.done{color:var(--ink);font-weight:500}
.ticket li b{width:20px;height:20px;border-radius:50%;border:2px solid #cfd6cd;display:grid;place-items:center;font-size:12px;flex:none}
.ticket li.done b{background:var(--green);border-color:var(--green);color:#fff}
.ticket li.now b{border-color:var(--pepper);background:var(--sun)}
.ticket li.now{color:var(--ink);font-weight:700}

/* browse */
.sect{padding-top:28px;padding-bottom:60px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 18px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;font-weight:500;cursor:pointer;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
.rcard{display:block;text-decoration:none;overflow:hidden;transition:transform .15s,box-shadow .15s}
.rcard:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(20,32,26,.12)}
.cover{height:130px;position:relative;display:grid;place-items:center;color:rgba(255,255,255,.95);font:800 64px var(--head);
  background-image:radial-gradient(circle at 20% 120%,rgba(255,255,255,.28) 0 22%,transparent 23%),radial-gradient(circle at 95% -10%,rgba(0,0,0,.14) 0 30%,transparent 31%)}
.cover .pill{position:absolute;left:12px;top:12px;font-size:12px;font-family:var(--body)}
.rcard .body{padding:14px 16px 16px}
.rcard h3{font-size:19px}
.rcard.closed .cover{filter:grayscale(.85)}
/* rider scene + loader */
.scene{position:relative}
.scene-svg{width:100%;height:auto;display:block;border-radius:24px;background:linear-gradient(#12906a,#0b6b4f);box-shadow:0 24px 50px rgba(0,0,0,.28)}
.scene-chip{position:absolute;left:14px;top:14px;background:#fff;color:var(--ink);border-radius:14px;padding:10px 14px;box-shadow:0 10px 24px rgba(0,0,0,.2);display:flex;flex-direction:column;line-height:1.3;font-size:14px}
.scene-chip b{font-family:var(--head);font-size:15px}
.scene-chip span{color:var(--muted)}
.wheel{transform-box:fill-box;transform-origin:center;animation:spin .55s linear infinite}
.rbody{animation:bob .5s ease-in-out infinite}
.sky{animation:skyl linear infinite}
.roadline{animation:roadl .5s linear infinite}
.speed{animation:speedl .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes skyl{to{transform:translateX(-560px)}}
@keyframes roadl{to{stroke-dashoffset:56}}
@keyframes speedl{0%{transform:translateX(18px);opacity:0}30%{opacity:.7}100%{transform:translateX(-26px);opacity:0}}
.loader{grid-column:1/-1;text-align:center;padding:30px 0}
.lane{position:relative;height:140px;max-width:440px;margin:0 auto;border-radius:20px;overflow:hidden;background:linear-gradient(#12906a,#0b6b4f)}
.lane .road{position:absolute;left:0;right:0;bottom:0;height:22px;background:#06402f}
.lane .road i{position:absolute;left:0;right:0;top:9px;height:4px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 22px,transparent 22px 44px);animation:laneline .5s linear infinite}
@keyframes laneline{to{background-position:-44px 0}}
.rollby{position:absolute;bottom:19px;width:150px;left:-170px;animation:rollby 3.2s linear infinite}
@keyframes rollby{to{left:100%}}
.loader p{margin:14px 0 0;font-weight:700;color:var(--green-d)}
/* reviews */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.stars{display:flex;flex-direction:row-reverse;justify-content:flex-end;border:0;padding:0;margin:0 0 12px;position:relative}
.stars input{position:absolute;opacity:0}
.stars label{font-size:42px;line-height:1;color:#cfd6cd;cursor:pointer;padding:0 3px;transition:transform .1s}
.stars label:hover{transform:scale(1.12)}
.stars input:checked~label,.stars label:hover,.stars label:hover~label{color:#ffb703}
.stars input:focus-visible+label{outline:3px solid var(--pepper);border-radius:8px}
.stars-v{color:#ffb703;letter-spacing:2px;white-space:nowrap}
.stars-v u{text-decoration:none;color:#d6dbd3}
.rate{font-weight:700;color:#b36b00}
.rsum{display:flex;gap:16px;align-items:center;margin-bottom:14px}
.rsum .big{font:800 48px var(--head)}
.review{margin-bottom:12px}
.review .top{display:flex;justify-content:space-between;gap:10px}
.review p{margin:8px 0}
.phonebox{display:flex;gap:18px;align-items:center}
.phonebox svg{width:150px;height:auto;flex:none}
@media (max-width:520px){.phonebox{flex-direction:column;text-align:center}}
@media (prefers-reduced-motion:reduce){.wheel,.rbody,.sky,.roadline,.speed,.rollby,.lane .road i{animation:none!important}.rollby{left:calc(50% - 75px)}}
.cover.photo{background-size:cover;background-position:center}
.thumb{width:96px;height:96px;object-fit:cover;border-radius:12px;background:#eceee9;display:block}
.iright{display:flex;flex-direction:column;align-items:center;gap:8px;flex:none}
.mthumb{width:52px;height:52px;object-fit:cover;border-radius:10px;flex:none;background:#eceee9}
.pbox{display:flex;gap:14px;align-items:center}
.pv{width:96px;height:96px;flex:none;border-radius:12px;background:#eceee9 center/cover no-repeat;display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center}
.pv.wide{width:160px;height:96px}
.pact{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pact .muted{flex-basis:100%;font-size:13px}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:8px;font-size:22px}
.skel{height:230px;border-radius:var(--r);background:linear-gradient(90deg,#eceee9,#f6f7f3,#eceee9);background-size:200% 100%;animation:sk 1.2s infinite linear}
@keyframes sk{to{background-position:-200% 0}}

/* restaurant */
.rhead{color:#fff;padding:34px 0 28px;background-image:radial-gradient(circle at 90% 130%,rgba(255,255,255,.22) 0 25%,transparent 26%)}
.rhead h1{font-size:clamp(30px,4.5vw,46px);font-weight:800}
.rhead p{margin:8px 0 0;max-width:40em;opacity:.95}
.back{display:inline-block;margin-bottom:14px;text-decoration:none;opacity:.9;font-weight:500}
.cat{font-size:22px;margin:30px 0 12px}
.item{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:16px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item b{font-size:17px}
.item .price{font-weight:700;margin-top:4px}
.stepper{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:999px;background:#fff}
.stepper button{width:34px;height:34px;border:0;background:none;font-size:20px;cursor:pointer;border-radius:50%}
.stepper button:hover{background:var(--green-t)}
.stepper span{min-width:24px;text-align:center;font-weight:700}
.cartbar{position:fixed;left:16px;right:16px;bottom:16px;z-index:15;max-width:560px;margin:0 auto}
.cartbar .btn{width:100%;justify-content:space-between;padding:15px 22px;box-shadow:0 10px 30px rgba(0,0,0,.25)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,20,15,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:#fff;z-index:41;transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
body.cart-open .scrim{opacity:1;pointer-events:auto}
body.cart-open .drawer{transform:none}
.drawer header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer .scroll{flex:1;overflow:auto;padding:8px 20px}
.drawer footer{padding:16px 20px;border-top:1px solid var(--line)}
.x{border:0;background:none;font-size:26px;cursor:pointer;line-height:1;padding:4px 8px;border-radius:8px}
.line{display:flex;justify-content:space-between;gap:12px;padding:5px 0}
.line.total{font-weight:800;font-size:18px;border-top:1px solid var(--line);margin-top:6px;padding-top:12px}
.badge{background:var(--pepper);color:#fff;border-radius:999px;font-size:12px;font-weight:700;padding:1px 7px;margin-left:6px}

/* forms / layouts */
.narrow{max-width:440px;margin:40px auto}
.split{display:grid;grid-template-columns:1.3fr .8fr;gap:24px;align-items:start;padding:32px 0 60px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#eceee9;padding:4px;border-radius:12px;margin-bottom:18px}
.seg label{text-align:center;padding:9px;border-radius:9px;cursor:pointer;font-weight:700}
.seg input{position:absolute;opacity:0}
.seg label:has(input:checked){background:#fff;box-shadow:var(--shadow)}
.seg label:has(input:focus-visible){outline:3px solid var(--pepper)}
.pay{display:flex;gap:12px;align-items:flex-start;border:1px solid #cfd6cd;border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer;background:#fff}
.pay:has(input:checked){border-color:var(--green);background:var(--green-t)}
.pay.off{opacity:.55;cursor:not-allowed}
.pay input{margin-top:5px;accent-color:var(--green)}

/* tracking */
.track{list-style:none;margin:20px 0 0;padding:0}
.track li{position:relative;padding:0 0 22px 38px;color:var(--muted)}
.track li::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--line)}
.track li:last-child::before{display:none}
.track li b{position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;border:2px solid #cfd6cd;background:#fff;display:grid;place-items:center;font-size:13px}
.track li.done{color:var(--ink)}
.track li.done b{background:var(--green);border-color:var(--green);color:#fff}
.track li.done::before{background:var(--green)}
.track li.now{color:var(--ink);font-weight:700}
.track li.now b{border-color:var(--pepper);background:var(--sun);box-shadow:0 0 0 5px rgba(255,210,63,.35)}
@media (prefers-reduced-motion:no-preference){.track li.now b{animation:pulse 1.8s infinite}}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(255,210,63,0)}}
.tcard{display:block;text-decoration:none;margin-bottom:14px;transition:transform .15s}
.tcard:hover{transform:translateY(-2px)}
.tcard .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:14px}
.prog{display:flex;gap:5px}
.prog i{flex:1;height:7px;border-radius:4px;background:var(--line)}
.prog i.on{background:var(--green)}
.prog i.now{background:var(--pepper)}
.trackbar{background:var(--sun);color:var(--ink);text-decoration:none;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 18px;border-radius:14px;margin-bottom:18px;font-weight:500}
.trackbar b{font-weight:800}
.olist a{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:16px 20px;text-decoration:none;border-top:1px solid var(--line)}
.olist a:first-child{border-top:0}
.olist a:hover{background:var(--green-t)}

/* dashboard */
.dh{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center;padding:28px 0 8px}
.dh h1{font-size:32px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:14px 0 22px}
.tabs button{border:0;background:none;padding:10px 16px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--green);border-color:var(--green)}
.ocard{padding:18px 20px;margin-bottom:14px}
.ocard .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.ocard ul{margin:10px 0;padding-left:18px}
.ocard .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.mitem{display:flex;gap:14px;justify-content:space-between;align-items:center;padding:14px 18px;border-top:1px solid var(--line)}
.mitem:first-child{border-top:0}
.mitem.off b{color:var(--muted);text-decoration:line-through}
.switch{position:relative;width:46px;height:26px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0}
.switch i{position:absolute;inset:0;background:#cfd6cd;border-radius:999px;transition:background .15s;pointer-events:none}
.switch i::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked+i{background:var(--green)}
.switch input:checked+i::after{transform:translateX(20px)}
.switch input:focus-visible+i{outline:3px solid var(--pepper)}
dialog{border:0;border-radius:18px;padding:24px;width:min(460px,calc(100% - 32px));box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,20,15,.5)}
#toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-weight:500;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translateX(-50%)}
footer.site{border-top:1px solid var(--line);padding:26px 0;color:var(--muted);font-size:14px}

@media (max-width:860px){
  .hero .wrap{grid-template-columns:1fr;padding-top:36px;padding-bottom:36px}
  .scene{max-width:540px}.scene-chip{display:none}
  .split{grid-template-columns:1fr}
}
@media (max-width:520px){.row2{grid-template-columns:1fr}.nav .link.opt,.nav .btn.opt{display:none}.nav .wrap{gap:6px}.logo{font-size:19px}.xs{display:none}}
.nav .wrap>*{white-space:nowrap}

/* places, google, admin */
.locp{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.locp .field{margin-bottom:0}
.gwrap{display:flex;justify-content:center;min-height:44px;margin-bottom:6px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;margin:14px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:18px}
.stat{padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.stat b{font:800 26px var(--head)}
.idimg{max-width:100%;width:340px;border-radius:12px;border:1px solid var(--line);margin-top:8px;display:block}
code{background:#eceee9;padding:2px 6px;border-radius:6px}
@media (max-width:700px){.locp{grid-template-columns:1fr}}

/* marketplace look */
:root{--pepper:#ec4c10}
.btn{background:var(--pepper)}.btn:hover{background:#cf3f0a}
.btn.alt{background:#fff}
.nav .wrap{height:auto;min-height:64px;padding-top:8px;padding-bottom:8px;flex-wrap:wrap}
.logo{margin-right:0}.sp{flex:1}
.nsearch{flex:1;max-width:620px;display:flex;background:#fff;border:1px solid #cfd6cd;border-radius:999px;padding:3px 3px 3px 16px;min-width:180px}
.nsearch:focus-within{border-color:var(--pepper);box-shadow:0 0 0 3px rgba(236,76,16,.2)}
.nsearch input{flex:1;border:0;outline:0;background:none;min-width:0}
@media (max-width:760px){.nsearch{order:9;flex-basis:100%;max-width:none}.sp{display:none}.logo{margin-right:auto}}
.shop{display:grid;grid-template-columns:230px 1fr;gap:16px;align-items:start}
.catmenu{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 0;position:sticky;top:110px}
.catmenu h3{font-size:13px;padding:10px 16px 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.catmenu a{display:flex;justify-content:space-between;gap:8px;padding:9px 16px;text-decoration:none;font-size:15px}
.catmenu a:hover{background:#fff4ea}
.catmenu a[aria-current=true]{color:var(--pepper);font-weight:700;background:#fff4ea}
.catmenu small{color:var(--muted)}
@media (max-width:860px){.shop{grid-template-columns:1fr}.catmenu{position:static;display:flex;overflow-x:auto;padding:6px;gap:6px;border-radius:12px}.catmenu h3{display:none}.catmenu a{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:7px 14px;flex:none}.catmenu small{display:none}}
.banner{position:relative;height:280px;border-radius:12px;overflow:hidden}

async function api(path,opt={}){

/* ---------- photos: shrink in the browser, then upload ---------- */
async function shrink(file,max=900){
  const bmp=await createImageBitmap(file).catch(()=>null);
  if(!bmp)throw new Error("That file isn't a photo we can use. Try a JPG or PNG.");
  const s=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas");c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);
  const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(bmp,0,0,c.width,c.height);
  return new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(new Error("Could not read that photo.")),"image/jpeg",.82));
}
async function uploadPhoto(file){
  const blob=await shrink(file);
  const r=await fetch("/api/vendor/upload",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"image/jpeg"},body:blob});
  const d=await r.json().catch(()=>null);
  if(!r.ok)throw new Error(d?.error||"Upload failed. Try again.");
  return d.url;
}
function photoPicker(host,url,opt={}){
  let cur=url||"",busy=false;
  host.innerHTML=`<div class="pbox"><div class="pv ${opt.wide?"wide":""}"></div><div class="pact"><button type="button" class="btn alt sm" data-pick></button><button type="button" class="btn danger sm" data-rm>Remove</button><div class="muted" data-msg></div></div><input type="file" accept="image/*" hidden></div>`;
  const pv=$(".pv",host),pick=$("[data-pick]",host),rm=$("[data-rm]",host),msg=$("[data-msg]",host),fi=$("input",host);
  const draw=()=>{pv.style.backgroundImage=cur?`url('${cur}')`:"";pv.textContent=cur?"":"No photo yet";pick.textContent=cur?"Change photo":"Add photo";rm.classList.toggle("hide",!cur||!!opt.required)};
  pick.onclick=()=>fi.click();
  rm.onclick=()=>{cur="";msg.textContent="";draw()};
  fi.onchange=async()=>{
    const f=fi.files[0];fi.value="";if(!f)return;
    busy=true;pick.disabled=true;msg.textContent="Uploading…";
    try{cur=await uploadPhoto(f);msg.textContent=""}catch(e){msg.textContent=e.message}
    busy=false;pick.disabled=false;draw();
  };
  draw();
  return{get:()=>cur,busy:()=>busy};
}

/* ---------- places: country > state > area, always dropdowns ---------- */
const geoCache={};
const geo=async p=>geoCache[p]||(geoCache[p]=await api("/geo/"+p));
function locPicker(host,val,opt={}){
  val=val||{};
  host.innerHTML=`<div class="locp"><label class="field"><span>Country</span><select data-k="country"></select></label><label class="field hide" data-w="state"><span>State</span><select data-k="state"></select></label><label class="field hide" data-w="city"><span data-l>Area</span><select data-k="city"></select></label></div>`;
  const S={country:val.country||opt.def||"",state:val.state||"",city:val.city||""};
  const sel=k=>$(`[data-k=${k}]`,host),wrap=k=>$(`[data-w=${k}]`,host);
  let n=0,hasStates=false,hasAreas=false,countries=[],states=[];
  const options=(list,cur,ph)=>`<option value="">${esc(ph)}</option>`+list.map(([v,l])=>`<option value="${esc(v)}"${v===cur?" selected":""}>${esc(l)}</option>`).join("");
  const cname=()=>countries.find(c=>c.code===S.country)?.name||"";
  const sname=()=>states.find(s=>s.code===S.state)?.name||"";
  async function fillAreas(my){
    if(!S.country||(hasStates&&!S.state)){hasAreas=false;S.city="";wrap("city").classList.add("hide");return}
    if(S.state==="*"){hasAreas=false;S.city="*";wrap("city").classList.add("hide");return}
    const d=await geo(`areas?country=${S.country}&state=${encodeURIComponent(S.state)}`);if(my!==n)return;
    hasAreas=d.areas.length>0;
    if(!hasAreas||(S.city!=="*"&&!d.areas.includes(S.city)))S.city="";
    wrap("city").classList.toggle("hide",!hasAreas);
    $("[data-l]",host).textContent=d.label;
    sel("city").innerHTML=options([...(opt.all?[["*","All of "+sname()]]:[]),...d.areas.map(a=>[a,a])],S.city,"Choose "+d.label.toLowerCase());
  }
  async function fillStates(){
    const my=++n;
    if(!S.country){hasStates=false;hasAreas=false;states=[];wrap("state").classList.add("hide");wrap("city").classList.add("hide");return}
    states=await geo("states?country="+S.country);if(my!==n)return;
    hasStates=states.length>0;
    if(S.state!=="*"&&!states.some(s=>s.code===S.state))S.state="";
    wrap("state").classList.toggle("hide",!hasStates);
    sel("state").innerHTML=options([...(opt.all?[["*","All of "+cname()]]:[]),...states.map(s=>[s.code,s.name])],S.state,"Choose state");
    await fillAreas(my);
  }
  const ready=(async()=>{
    countries=await geo("countries");
    const top=countries.filter(c=>c.code==="NG"),rest=countries.filter(c=>c.code!=="NG");
    sel("country").innerHTML=options([...top,...rest].map(c=>[c.code,c.name]),S.country,"Choose country");
    await fillStates();
  })();
  host.addEventListener("change",async e=>{
    const k=e.target.dataset.k;if(!k)return;
    S[k]=e.target.value;
    if(k==="country"){S.state="";S.city="";await fillStates()}
    else if(k==="state"){S.city="";await fillAreas(++n)}
    opt.onchange&&opt.onchange();
  });
  return{ready,get(){
    if(!S.country||(hasStates&&!S.state))return null;
    if(S.state==="*")return{country:S.country,state:"*",city:"*"};
    if(hasAreas&&!S.city)return null;
    return{country:S.country,state:S.state,city:S.city};
  }};
}

/* ---------- cart (items from many sellers, one payment) ---------- */
let cartHook=null,quotes={};
const lineKey=(id,size,color)=>id+"|"+(size||"")+"|"+(color||"");
const sellersInCart=()=>{const m=new Map();for(const i of cart.items){if(!m.has(i.vid))m.set(i.vid,{vid:i.vid,name:i.vn,items:[]});m.get(i.vid).items.push(i)}return[...m.values()]};
const sellerSub=g=>g.items.reduce((a,i)=>a+i.p*i.q,0);
// delivery price depends on distance, so we ask the server once we know where the shopper is
async function loadQuotes(){
  const l=getLoc(),ids=sellersInCart().map(g=>g.vid);
  if(!l||!ids.length){quotes={};return}
  try{quotes=await api("/quote",{method:"POST",body:{vendors:ids,loc:l}})}catch{quotes={}}
}
const cartFees=()=>{
  const g=sellersInCart(),sub=cartSub(),svc=g.reduce((s,x)=>s+svcFee(sellerSub(x)),0),known=g.filter(x=>quotes[x.vid]),delivery=known.reduce((s,x)=>s+quotes[x.vid].fee,0);
  return{sub,delivery,svc,n:g.length,unknown:g.length-known.length,total:sub+delivery+svc};
};
const optLine=i=>[i.size&&"Size "+i.size,i.color].filter(Boolean).join(" · ");
const inCart=id=>cart.items.filter(i=>i.id===id).reduce((s,i)=>s+i.q,0);
function addToCart(p,q=1,opt={}){
  const size=opt.size||"",color=opt.color||"",k=lineKey(p.id,size,color),have=inCart(p.id);
  if(have+q>p.stock){toast(p.stock-have>0?`Only ${p.stock} available`:`You already have all ${p.stock} in your cart`);return false}
  const l=cart.items.find(i=>i.k===k);
  if(l){l.q+=q;l.p=p.price;l.stock=p.stock}else cart.items.push({k,id:p.id,n:p.name,p:p.price,q,img:p.image,vid:p.vendorId,vn:p.store,stock:p.stock,size,color});
  saveCart();cartHook&&cartHook();loadQuotes().then(()=>cartHook&&cartHook());return true;
}
function changeQty(k,d){
  const l=cart.items.find(i=>i.k===k);if(!l)return;
  if(d>0&&inCart(l.id)+d>l.stock)return toast("That's all we have in stock");
  l.q+=d;if(l.q<=0)cart.items=cart.items.filter(i=>i.k!==k);
  saveCart();cartHook&&cartHook();
}
function openCart(){drawCart();document.body.classList.add("cart-open");$("#drawer .x")?.focus();loadQuotes().then(()=>{if(document.body.classList.contains("cart-open"))drawCart()})}
function closeCart(){document.body.classList.remove("cart-open")}
function drawCart(){
  const d=$("#drawer");
  if(!cart.items.length){d.innerHTML=`<header><h2>Your cart</h2><button class="x" aria-label="Close cart">×</button></header><div class="scroll"><div class="empty"><h3>Your cart is empty</h3><p>Browse products and add what you like.</p></div></div>`;return}
  const f=cartFees();
  d.innerHTML=`<header><div><h2>Your cart</h2><div class="muted">${cartCount()} item${cartCount()===1?"":"s"}</div></div><button class="x" aria-label="Close cart">×</button></header>
  <div class="scroll">${sellersInCart().map(g=>`<div class="muted" style="margin:14px 0 2px;font-weight:700">Sold by ${esc(g.name)}</div>${g.items.map(i=>`<div class="item" style="padding:10px 0"><div style="display:flex;gap:10px;min-width:0;align-items:center"><img class="mthumb" src="${esc(i.img)}" alt=""><div style="min-width:0"><b style="font-size:15px">${esc(i.n)}</b>${optLine(i)?`<div class="opts">${esc(optLine(i))}</div>`:""}<div class="price">${ngn(i.p*i.q)}</div></div></div>
    <div class="stepper"><button data-dec="${esc(i.k)}" aria-label="Remove one ${esc(i.n)}">−</button><span>${i.q}</span><button data-inc="${esc(i.k)}" aria-label="Add one ${esc(i.n)}">+</button></div></div>`).join("")}${quotes[g.vid]?`<div class="opts">Delivery ${ngn(quotes[g.vid].fee)} · ${quotes[g.vid].km} km · ${esc(quotes[g.vid].eta)}</div>`:""}`).join("")}</div>
  <footer><div class="line"><span class="muted">Items</span><span>${ngn(f.sub)}</span></div>
  <div class="line"><span class="muted">Delivery</span><span>${f.unknown?(f.unknown===f.n?"Set at checkout":"+ more at checkout"):ngn(f.delivery)}</span></div>
  <div class="line"><span class="muted">Service fee (${cfg.servicePct}%)</span><span>${ngn(f.svc)}</span></div>
  <div class="line total"><span>Total${f.unknown?" (before delivery)":""}</span><span>${ngn(f.total)}</span></div>
  ${f.unknown?`<p class="muted" style="margin:8px 0 0;font-size:13px">Delivery is priced by distance. Choose your area at checkout to see it.</p>`:""}
  <button class="btn block" id="tocheckout" style="margin-top:14px">Go to checkout</button></footer>`;
}
$("#drawer").addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;

}
async function checkout(){

  const off=cfg.payMode==="off";
  view(`<div class="wrap"><div class="split"><form id="f"><h1 style="font-size:34px;margin-bottom:18px">Checkout</h1><div id="e"></div>

  <div class="card pad"><h3 style="margin-bottom:8px">Payment</h3>
  <p style="margin:0">You pay here, inside Ymo Express. We hold your money safely and only pass it on after your order is delivered. You get a 4-digit code to give the rider when your order arrives.</p>
  ${cfg.payMode==="demo"?`<div class="err" style="background:#fff3cd;color:#7a5a00;margin:12px 0 0">Test mode: no real money is taken.</div>`:""}
  ${off?`<div class="err" style="margin:12px 0 0">Payments are not switched on yet, so orders can't be placed.</div>`:""}</div></form>

    <div class="line"><span class="muted">Items</span><span>${ngn(f.sub)}</span></div><div class="line"><span class="muted">Delivery</span><span>${f.unknown?"Choose your area":ngn(f.delivery)}</span></div>
    <div class="line"><span class="muted">Service fee (${cfg.servicePct}%)</span><span>${ngn(f.svc)}</span></div>
    <div class="line total"><span>Total</span><span>${f.unknown?"–":ngn(f.total)}</span></div>
    <button class="btn block" id="place" form="f" style="margin-top:14px" ${off||f.unknown||bad?"disabled":""}>${f.unknown?"Choose your delivery area":"Pay "+ngn(f.total)}</button>`;
  };
  const lp=locPicker($("#lp"),getLoc(),{def:"NG",onchange:async()=>{const l=lp.get();if(l){setLoc(l);await loadQuotes()}else quotes={};if($("#sum"))drawSum()}});
  drawSum();
  lp.ready.then(async()=>{if(lp.get()){await loadQuotes();if($("#sum"))drawSum()}});
  $("#f").onsubmit=async e=>{

  <aside class="card pad"><h3>Your order</h3><div style="margin:12px 0">${g.orders.map(o=>`<div class="muted" style="font-weight:700;margin-top:8px">Sold by ${esc(o.restaurant)}</div>${o.items.map(i=>`<div class="line"><span>${i.q} × ${esc(i.n)}${optLine(i)?`<br><small class="muted">${esc(optLine(i))}</small>`:""}</span><span>${ngn(i.p*i.q)}</span></div>`).join("")}`).join("")}</div>

      <div class="route"><div><span class="dot"></span><b>Pick up:</b> ${esc(g.pickup)}${g.address?` · ${esc(g.address)}`:""}</div><div><span class="dot b"></span><b>Drop off:</b> ${esc(g.drop)}</div></div>
      <div class="muted">${g.km} km · ${esc(g.eta)}</div>
      <div class="acts"><button class="btn sm hot" data-take="${esc(g.id)}" ${d.active>=d.max?"disabled":""}>Take this gig</button></div></div>`).join("")
     :`<div class="empty"><h3>No gigs right now</h3><p>When a seller in your area packs an order, it shows up here. This page refreshes by itself.</p></div>`);
  };
  p.onclick=async e=>{const b=e.target.closest("[data-take]");if(!b)return;b.disabled=true;
    try{await api(`/rider/gigs/${b.dataset.take}/accept`,{method:"POST"});toast("Gig taken. Head to the seller.");rtab="jobs";$$(".tabs button").forEach(x=>x.setAttribute("aria-selected",x.dataset.t==="jobs"));riderPanel()}
    catch(x){toast(x.message);load().catch(()=>{})}};
  await load();timer=setInterval(()=>load().catch(()=>{}),10000);
}
const lineList=j=>`<ul style="margin:8px 0">${j.lines.map(l=>`<li>${l.q} × ${esc(l.n)}${optLine(l)?` <b>(${esc(optLine(l))})</b>`:""}</li>`).join("")}</ul>`;
function jobCard(j){
  const pick=j.stage===2;
  return `<div class="card ocard"><div class="top"><div><b style="font-size:18px">${esc(j.id)}</b> <span class="muted">${esc(j.store)}</span></div><b style="font-size:20px;color:var(--green-d)">${ngn(j.earn)}</b></div>
  <span class="pill">${pick?"Step 1 of 2: go to the seller":"Step 2 of 2: deliver to the customer"}</span>
  ${pick?`<div class="route"><div><span class="dot"></span><b>Pick up from ${esc(j.store)}</b><br>${esc(j.address||j.pickup)}${j.address?`, ${esc(j.pickup)}`:""}<br>Seller phone: <a href="tel:${esc(j.storePhone)}">${esc(j.storePhone)}</a></div></div>${lineList(j)}
    <div class="acts"><button class="btn sm hot" data-pick="${esc(j.id)}">I've picked it up</button><button class="btn sm alt" data-rel="${esc(j.id)}">Give this job back</button></div>`
  :`<div class="route"><div><span class="dot b"></span><b>Deliver to ${esc(j.customer)}</b><br>${esc(j.addr)}, ${esc(j.drop)}<br>Phone: <a href="tel:${esc(j.phone)}">${esc(j.phone)}</a>${j.note?`<br><i>Note: ${esc(j.note)}</i>`:""}</div></div>${lineList(j)}
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:8px"><label class="field" style="margin:0"><span>Delivery code from the customer</span><input data-code="${esc(j.id)}" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="4 digits" style="width:140px"></label><button class="btn sm hot" data-del="${esc(j.id)}">Complete delivery</button></div>
    <small class="muted">Ask the customer for the 4-digit code on their order page when you hand over the order.</small>`}</div>`;
}
async function jobsPanel(){
  const p=$("#panel");p.innerHTML=`<div class="skel" style="height:140px"></div>`;
  const load=async force=>{
    const js=await api("/rider/jobs");if(rtab!=="jobs"||!$("#panel"))return;
    if(!force&&$$("input[data-code]",p).some(i=>i.value))return; // don't wipe a code that is being typed
    const act=js.filter(j=>j.stage<4),done=js.filter(j=>j.stage>=4);
    p.innerHTML=(act.length?act.map(jobCard).join(""):`<div class="empty"><h3>No active jobs</h3><p>Take a gig from the Gigs tab.</p></div>`)+
      (done.length?`<h3 style="margin:24px 0 10px">Finished</h3><div class="card">${done.map(j=>`<div class="mitem"><div><b>${esc(j.id)}</b> · ${esc(j.store)}<div class="muted">${j.km} km${j.deliveredAt?" · "+dateOf(j.deliveredAt):""}</div></div><div style="text-align:right"><b>${ngn(j.earn)}</b><div><span class="pill ${j.status==="Available"?"":"warn"}">${esc(j.status)}</span></div></div></div>`).join("")}</div>`:"");
  };
  p.onclick=async e=>{
    const b=e.target.closest("button[data-pick],button[data-rel],button[data-del]");if(!b)return;
    const id=b.dataset.pick||b.dataset.rel||b.dataset.del;b.disabled=true;
    try{
      if(b.dataset.pick){await api(`/rider/jobs/${id}/pickup`,{method:"POST"});toast("Picked up. Now deliver it.")}
      else if(b.dataset.rel){if(!confirm("Give this job back so another rider can take it?")){b.disabled=false;return}await api(`/rider/jobs/${id}/release`,{method:"POST"});toast("Job given back")}
      else{const code=$(`input[data-code="${id}"]`).value.trim();if(!/^\d{4}$/.test(code)){toast("Enter the 4-digit code");b.disabled=false;return}
        await api(`/rider/jobs/${id}/deliver`,{method:"POST",body:{code}});toast("Delivered! Your earnings are on the way.")}
      load(true);
    }catch(x){toast(x.message);b.disabled=false}
  };
  await load(true);timer=setInterval(()=>load().catch(()=>{}),15000);
}
function riderSettings(){
  const cov=()=>R.coverage.map((c,i)=>`<span class="chip" style="display:inline-flex;gap:4px;align-items:center;cursor:default">${esc(c.text)}<button type="button" class="x" data-rm="${i}" aria-label="Remove ${esc(c.text)}" style="font-size:18px;padding:0 4px">×</button></span>`).join("");
  $("#panel").innerHTML=`<div style="max-width:600px"><form class="card pad" id="vf2"><div id="ve"></div><label class="field"><span>Your vehicle</span><select name="vehicle">${(cfg.vehicles||[]).map(v=>`<option${R.vehicle===v?" selected":""}>${esc(v)}</option>`).join("")}</select></label><button class="btn">Save</button></form>
  <div class="card pad" style="margin-top:18px"><h3>Where you ride</h3><p class="muted" style="margin:4px 0 12px">You see gigs whose pickup is in these places. Add as many as you like.</p>
  <div id="cov" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px">${cov()}</div><div id="cl"></div><button type="button" class="btn alt" id="addcov">Add this place</button></div>
  <div class="card pad" style="margin-top:18px"><h3>Identity check</h3><p class="muted" style="margin:4px 0 0">${esc(me.idType||"ID")} ${esc(R.idMasked)} · ${R.idSent?"photo received":"photo missing"}. Only the Ymo Express admin team can see it.</p></div></div>`;
  const cl=locPicker($("#cl"),{country:R.loc?.country,state:"*",city:"*"},{def:R.loc?.country||"NG",all:true});
  $("#vf2").onsubmit=async e=>{e.preventDefault();try{R=await api("/rider/me",{method:"PATCH",body:Object.fromEntries(new FormData(e.target))});toast("Saved")}catch(x){$("#ve").innerHTML=`<div class="err">${esc(x.message)}</div>`}};
  const saveCov=async l=>{try{R=await api("/rider/me",{method:"PATCH",body:{coverage:l.map(({country,state,city})=>({country,state,city}))}});$("#cov").innerHTML=cov();toast("Places updated")}catch(x){toast(x.message)}};
  $("#addcov").onclick=()=>{const l=cl.get();if(!l)return toast("Choose a country, state and area first");saveCov([...R.coverage,l])};
  $("#cov").onclick=e=>{const b=e.target.closest("[data-rm]");if(!b)return;if(R.coverage.length<2)return toast("Keep at least one place you ride in");saveCov(R.coverage.filter((_,i)=>i!==+b.dataset.rm))};
}

/* ---------- account status (waiting for approval) ---------- */
async function statusPage(){
  if(!me)return go("#/login");
  if(me.role==="admin")return go("#/admin");
  const fresh=await api("/me");if(fresh)me=fresh;renderNav();
  if(me.status==="approved")return afterAuth();
  const v=me.role==="vendor"||me.role==="rider",rd=me.role==="rider",st=me.status;
  const title={pending:"Thanks! We're checking your account",rejected:"Your account was not approved",suspended:"Your account is suspended"}[st];
  const body=st==="pending"?(v&&!me.idSent?"We still need a photo of your ID card before we can review your account.":v?(rd?"We received your ID card. We approve every rider before they can take gigs, and we'll email you when it's done.":"We received your ID card. We approve every store before it goes live, and we'll email you when it's done."):"We approve every new account. We'll email you as soon as yours is ready.")
    :st==="rejected"?(v?"You can upload a clearer photo of your ID card and we'll look again.":"Contact us if you think this is a mistake."):"Contact us if you think this is a mistake.";
  view(`<div class="wrap"><div class="card pad narrow" style="text-align:center"><span class="pill ${st==="pending"?"warn":"bad"}">${st==="pending"?"Waiting for approval":st}</span>
  <h1 style="font-size:28px;margin:14px 0 8px">${esc(title)}</h1><p class="muted" style="margin:0 0 16px">${esc(body)}</p>
  ${me.statusNote?`<div class="err" style="text-align:left"><b>Reason:</b> ${esc(me.statusNote)}</div>`:""}
  ${v&&st!=="suspended"&&(!me.idSent||st==="rejected")?`<form id="idf2" style="text-align:left"><div id="ie"></div><label class="field"><span>Photo of your ${esc(me.idType||"ID card")}</span><input type="file" id="idfile" accept="image/*" required></label><button class="btn block">Upload ID card</button></form>`:""}
  <p class="muted" style="margin:16px 0 0;font-size:14px">This page updates by itself.</p></div></div>`);
  $("#idf2")?.addEventListener("submit",async e=>{e.preventDefault();const b=$("#idf2 .btn");b.disabled=true;
    try{me=await uploadId($("#idfile").files[0]);toast("ID card uploaded");statusPage()}
    catch(x){$("#ie").innerHTML=`<div class="err">${esc(x.message)}</div>`;b.disabled=false}});
  timer=setInterval(async()=>{try{const m=await api("/me");if(m&&(m.status!==me.status||m.idSent!==me.idSent)){me=m;renderNav();statusPage()}}catch{}},12000);
}

/* ---------- admin console ---------- */
let atab="overview";
const dateOf=d=>new Date(d).toLocaleDateString("en-NG",{day:"numeric",month:"short",year:"numeric"});
async function adminPage(){
  if(!me){lsSet("ymo_next","#/admin");return go("#/login")}
  if(me.role!=="admin"){view(`<div class="wrap"><div class="empty"><h3>Admins only</h3></div></div>`);return}
  const c=await api("/admin/counts");
  view(`<div class="wrap"><div class="dh"><div><h1>Admin</h1><div class="muted">Approve accounts, watch the money, pay sellers and riders</div></div></div>
  <div class="tabs" role="tablist">${[["overview","Overview"],["approvals",`Approvals${c.pending?`<span class="badge">${c.pending}</span>`:""}`],["users","All accounts"],["payouts","Payouts"],["orders","Orders"]].map(([k,l])=>`<button role="tab" data-t="${k}" aria-selected="${atab===k}">${l}</button>`).join("")}</div>
  <div id="panel" style="padding-bottom:60px"></div></div>`);
  $(".tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;atab=b.dataset.t;$$(".tabs button").forEach(x=>x.setAttribute("aria-selected",x===b));aPanel()};
  aPanel();
}
function aPanel(){clearInterval(timer);const pn=$("#panel");pn.onclick=null;pn.onchange=null;pn.oninput=null;
  ({overview:overviewPanel,approvals:approvalsPanel,users:usersPanel,payouts:payoutsPanel,orders:adminOrdersPanel})[atab]().catch(x=>{$("#panel").innerHTML=`<div class="err">${esc(x.message)}</div>`})}
async function overviewPanel(){
  const [s,c]=await Promise.all([api("/admin/summary"),api("/admin/counts")]);
  const t=(l,v,sub)=>`<div class="card stat"><span class="muted">${l}</span><b>${v}</b>${sub?`<span class="muted" style="font-size:13px">${sub}</span>`:""}</div>`;
  $("#panel").innerHTML=`<div class="stats">${t("Ymo Express revenue",ngn(s.revenue),`${ngn(s.commission)} commission + ${ngn(s.serviceFees)} service fees + ${ngn(s.riderCuts)} rider cut`)}${t("Money taken from customers",ngn(s.taken),s.orders+" paid orders")}
  ${t("Held for sellers",ngn(s.heldForVendors),"orders not finished yet")}${t("Owed to sellers",ngn(s.owedToVendors),"delivered, not yet paid out")}${t("Owed to riders",ngn(s.owedToRiders),"delivered, not yet paid out")}${t("Orders waiting for a rider",s.needRider,"packed, nobody has taken them")}${t("Payout requests waiting",ngn(s.withdrawalsWaiting))}
  ${t("Accounts waiting for approval",c.pending)}${t("Sellers",s.vendors)}${t("Riders",s.riders)}${t("Customers",s.customers)}</div>
  <div class="card pad"><b>Payments mode: ${s.payMode==="paystack"?"live (Paystack)":s.payMode==="demo"?"TEST MODE (no real money)":"off"}</b></div>`;
}
const stCls=s=>s==="approved"?"":s==="pending"?"warn":"bad";
function userCard(u){
  const v=u.role==="vendor",r=u.role==="rider",pro=v||r,acts={pending:[["approve","Approve","hot"],["reject","Reject","danger"]],rejected:[["approve","Approve",""]],approved:[["suspend","Suspend","danger"]],suspended:[["reactivate","Reactivate",""]]}[u.status]||[];
  return `<div class="card ocard"><div class="top"><div><b style="font-size:18px">${esc(u.name)}</b> <span class="pill off">${v?"Seller":r?"Rider":"Customer"}</span> <span class="pill ${stCls(u.status)}">${esc(u.status)}</span>${u.google?` <span class="pill off">Google</span>`:""}</div><span class="muted">Joined ${dateOf(u.createdAt)}</span></div>
  <div class="muted" style="margin:6px 0">${esc(u.email)} · ${esc(u.phone)}${u.age!=null?` · ${u.age} years old (born ${esc(u.dob)})`:""}</div>
  ${pro?`<div>${v?`<b>${esc(u.restaurant)}</b> · ${esc(u.where)} · ${u.items} product${u.items===1?"":"s"}`:`<b>${esc(u.vehicle)}</b> · rides in ${esc(u.where)} · ${u.jobs} finished deliver${u.jobs===1?"y":"ies"}`}</div><div style="margin-top:8px"><b>${esc(u.idType)}</b> number: <code>${esc(u.idNumber)}</code></div>
    ${u.idPhoto?`<a href="/api/admin/id/${esc(u.id)}" target="_blank" rel="noopener"><img class="idimg" src="/api/admin/id/${esc(u.id)}" alt="ID card of ${esc(u.name)}"></a>`:`<div style="margin-top:8px"><span class="pill warn">No ID photo uploaded</span></div>`}`:`<div class="muted">${u.orders||0} paid order${u.orders===1?"":"s"}</div>`}
  ${u.statusNote?`<div class="muted" style="margin-top:6px"><i>Note: ${esc(u.statusNote)}</i></div>`:""}
  ${acts.length?`<div class="acts">${acts.map(([a,l,c])=>`<button class="btn sm ${c}" data-act="${a}" data-id="${esc(u.id)}">${l}</button>`).join("")}</div>`:""}</div>`;
}
async function userAct(b){
  const act=b.dataset.act;let note="";
  if(act==="reject"||act==="suspend"){note=prompt("Reason (the person will see this):","");if(note===null)return}
  b.disabled=true;
  try{await api("/admin/users/"+b.dataset.id,{method:"POST",body:{action:act,note}});toast("Done");adminPage()}
  catch(x){toast(x.message);b.disabled=false}
}
async function approvalsPanel(){
  const us=await api("/admin/users?status=pending");
  $("#panel").innerHTML=us.length?`<p class="muted" style="margin-top:0">Check the name, age and ID card before you approve. Approved sellers go live straight away.</p>`+us.map(userCard).join(""):`<div class="empty"><h3>Nothing waiting</h3><p>New sign-ups that need approval will show up here.</p></div>`;
  $("#panel").onclick=e=>{const b=e.target.closest("[data-act]");if(b)userAct(b)};
}
async function usersPanel(){
  const p=$("#panel");let role="",status="",q="";
  p.innerHTML=`<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px"><select id="fr" aria-label="Type" style="padding:10px;border-radius:10px;border:1px solid #cfd6cd"><option value="">Everyone</option><option value="vendor">Sellers</option><option value="rider">Riders</option><option value="customer">Customers</option></select>
  <select id="fs" aria-label="Status" style="padding:10px;border-radius:10px;border:1px solid #cfd6cd"><option value="">Any status</option><option>pending</option><option>approved</option><option>rejected</option><option>suspended</option></select>
  <input id="fq" type="search" placeholder="Search name, email or phone" style="flex:1;min-width:200px;padding:10px;border-radius:10px;border:1px solid #cfd6cd"></div><div id="ul"></div>`;
  let t;const load=async()=>{const us=await api(`/admin/users?role=${role}&status=${status}&q=${encodeURIComponent(q)}`);if(!$("#ul"))return;
    $("#ul").innerHTML=us.length?us.map(userCard).join(""):`<div class="empty"><h3>No accounts found</h3></div>`};
  $("#fr").onchange=e=>{role=e.target.value;load()};$("#fs").onchange=e=>{status=e.target.value;load()};
  $("#fq").oninput=e=>{q=e.target.value.trim();clearTimeout(t);t=setTimeout(load,300)};
  p.onclick=e=>{const b=e.target.closest("[data-act]");if(b)userAct(b)};
  await load();
}
async function payoutsPanel(){
  const ws=await api("/admin/withdrawals");
  $("#panel").innerHTML=ws.length?`<p class="muted" style="margin-top:0">Send the money to the bank account shown, then tap "Mark as paid".</p>`+ws.map(w=>`<div class="card ocard"><div class="top"><div><b style="font-size:18px">${ngn(w.amount)}</b> <span class="muted">${esc(w.kind)}: ${esc(w.vendor)} · ${esc(w.id)} · ${dateOf(w.createdAt)}</span></div><span class="pill ${w.status==="paid"?"":w.status==="rejected"?"bad":"warn"}">${w.status==="requested"?"Waiting for you":esc(w.status)}</span></div>
    <div style="margin-top:8px"><b>${esc(w.bank.bankName)}</b> · <code>${esc(w.bank.accountNumber)}</code> · ${esc(w.bank.accountName)}</div>
    ${w.status==="requested"?`<div class="acts"><button class="btn sm hot" data-wid="${esc(w.id)}" data-act="paid">Mark as paid</button><button class="btn sm danger" data-wid="${esc(w.id)}" data-act="reject">Reject</button></div>`:w.note?`<div class="muted"><i>${esc(w.note)}</i></div>`:""}</div>`).join(""):`<div class="empty"><h3>No payout requests</h3></div>`;
  $("#panel").onclick=async e=>{const b=e.target.closest("[data-wid]");if(!b)return;let note="";
    if(b.dataset.act==="reject"){note=prompt("Reason (the vendor will see this):","");if(note===null)return}
    else if(!confirm("Mark this payout as paid? Only do this after you sent the money."))return;
    b.disabled=true;
    try{await api("/admin/withdrawals/"+b.dataset.wid,{method:"POST",body:{action:b.dataset.act,note}});toast("Updated");payoutsPanel()}catch(x){toast(x.message);b.disabled=false}};
}
async function adminOrdersPanel(){
  const os=await api("/admin/orders");
  $("#panel").innerHTML=os.length?`<div class="card">${os.map(o=>`<div class="mitem"><div><b>${esc(o.id)}</b> · ${esc(o.restaurant)}<div class="muted">${dateOf(o.at)} · ${esc(o.where)} · ${o.km} km · ${esc(o.stageName)}</div>${o.needsRider?`<span class="pill warn">No rider yet</span>`:o.rider?`<div class="muted">Rider: ${esc(o.rider)}</div>`:""}</div>
    <div style="text-align:right"><b>${ngn(o.total)}</b><div class="muted" style="font-size:13px">we keep ${ngn(o.commission+o.serviceFee+o.riderCut)} · seller ${ngn(o.vendorNet)} · delivery ${ngn(o.fee)}${o.cleared?" (released)":""}</div></div></div>`).join("")}</div>`:`<div class="empty"><h3>No paid orders yet</h3></div>`;
}

/* ---------- router ---------- */
const routes=[[/^#?\/?(?:\?(.*))?$/,home],[/^#\/p\/(\w+)$/,productPage],[/^#\/r\/(\w+)$/,vendorPage],[/^#\/pay\/([\w-]+)$/,payPage],[/^#\/checkout$/,checkout],[/^#\/order\/([\w-]+)$/,orderPage],[/^#\/orders$/,ordersPage],
  [/^#\/login$/,loginPage],[/^#\/signup(?:\/(vendor|rider))?$/,signupPage],[/^#\/dashboard$/,dashboard],[/^#\/rider$/,riderPage],[/^#\/status$/,statusPage],[/^#\/admin$/,adminPage]];
async function route(){
  clearInterval(timer);curV=null;curP=null;cartHook=null;closeCart();
  if(me?.role==="customer"&&me.status==="approved"&&!/^#\/orders$/.test(location.hash))refreshActive();
  const h=location.hash||"#/";
  if(me&&me.role!=="admin"&&me.status!=="approved"&&/^#\/(checkout|pay\/|orders|order\/|dashboard|rider)/.test(h))return go("#/status");
  if(me?.role==="admin"&&/^#\/(checkout|pay\/|orders|order\/|dashboard|rider)/.test(h))return go("#/admin");
  for(const [re,fn] of routes){const m=h.match(re);if(m){
    scrollTo(0,0);
    const n0=viewN,lt=setTimeout(()=>{if(viewN===n0)view(loaderHTML("Loading…"))},180);
    try{await fn(...m.slice(1));clearTimeout(lt)}
    catch(e){
      clearTimeout(lt);
      if(e.status===401){me=null;renderNav();lsSet("ymo_next",h);return go("#/login")}
      view(`<div class="wrap"><div class="empty"><h3>${e.status===404?"We couldn't find that":"Something went wrong"}</h3><p>${esc(e.status===404?"It may have been removed.":e.message)}</p><a class="btn" href="#/">Back to shop</a></div></div>`);
    }
    $("#app").focus({preventScroll:true});return}}
  view(`<div class="wrap"><div class="empty"><h3>Page not found</h3><a class="btn" href="#/">Back to shop</a></div></div>`);
}
window.addEventListener("hashchange",route);

(async()=>{
  const q=new URLSearchParams(location.search);
  if(q.get("pay")){history.replaceState(null,"",location.pathname+"#/pay/"+q.get("pay"))}
  try{[me,cfg]=await Promise.all([api("/me"),api("/config")])}catch{}
  renderNav();route();
})();
</script>
